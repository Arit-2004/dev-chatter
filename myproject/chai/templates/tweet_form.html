{% extends "layout.html" %}

{% block title %}
Dev-Chatter
{% endblock %}

{% block content %}

<style>
    html, body {
        min-height: 100%;
    }

    .tweet-page {
        min-height: calc(100vh - 70px);
        width: 100%;
        position: relative;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 15px;
    }

    /* Background */
    .tweet-page::before {
        content: "";
        position: fixed;
        width: 500px;
        height: 500px;
        background: rgba(255, 193, 7, 0.20);
        border-radius: 50%;
        filter: blur(120px);
        top: -150px;
        left: -150px;
        z-index: 0;
    }

    .tweet-page::after {
        content: "";
        position: fixed;
        width: 500px;
        height: 500px;
        background: rgba(13, 110, 253, 0.25);
        border-radius: 50%;
        filter: blur(120px);
        bottom: -150px;
        right: -150px;
        z-index: 0;
    }

    /* Tweet Card */
    .tweet-card {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 600px;
        border: 1px solid rgba(255,255,255,0.15);
        border-radius: 20px;
        background: rgba(33,37,41,0.90);
        backdrop-filter: blur(15px);
    }

    /* Labels */
    .tweet-card label {
        color: #f1f3f5;
        font-weight: 500;
        display: block;
        margin-bottom: 6px;
    }

    /* Inputs */
    .tweet-card input,
    .tweet-card textarea,
    .tweet-card select {
        width: 100%;
        max-width: 100%;
        box-sizing: border-box;
        background: #343a40;
        color: white;
        border: 1px solid #6c757d;
        border-radius: 8px;
        padding: 12px;
        font-size: 16px;
    }

    /* Textarea */
    .tweet-card textarea {
        min-height: 150px;
        resize: vertical;
    }

    /* File input */
    .tweet-card input[type="file"] {
        padding: 8px;
        font-size: 14px;
    }

    /* Focus */
    .tweet-card input:focus,
    .tweet-card textarea:focus,
    .tweet-card select:focus {
        background: #343a40;
        color: white;
        border-color: #ffc107;
        box-shadow: 0 0 10px rgba(255,193,7,0.3);
        outline: none;
    }

    /* Django form paragraphs */
    .tweet-card p {
        margin-bottom: 18px;
        text-align: left;
    }

    /* Help text */
    .tweet-card .helptext {
        display: block;
        color: #adb5bd;
        font-size: 13px;
        margin-top: 5px;
    }

    /* Error messages */
    .tweet-card .errorlist {
        color: #ff6b6b;
        padding-left: 20px;
        margin-bottom: 8px;
        font-size: 14px;
    }

    /* Homepage link */
    .home-link {
        text-decoration: none;
        color: #ffc107;
    }

    .home-link:hover {
        text-decoration: underline;
    }

    /* Mobile */
    @media (max-width: 576px) {

        .tweet-page {
            min-height: calc(100vh - 60px);
            padding: 25px 10px;
            align-items: flex-start;
        }

        .tweet-card {
            border-radius: 16px;
        }

        .tweet-card .card-body {
            padding: 25px 18px !important;
        }

        .tweet-card h1 {
            font-size: 26px;
        }

        .tweet-card h4 {
            font-size: 20px;
        }

        .tweet-card input,
        .tweet-card textarea,
        .tweet-card select {
            font-size: 16px;
            padding: 11px;
        }

        .tweet-card textarea {
            min-height: 140px;
        }

        .tweet-card .btn {
            padding: 12px;
            font-size: 16px;
        }
    }
</style>

<div class="tweet-page">

    <div class="card shadow-lg tweet-card">

        <div class="card-body p-4 p-md-5">

            <h1 class="text-center fw-bold mb-2">
                Dev-Chatter 💬
            </h1>

            <h4 class="text-center text-warning mb-4">

                {% if form.instance.pk %}
                    Edit Tweet ✏️
                {% else %}
                    Create Tweet 📝
                {% endif %}

            </h4>

            <form method="POST" enctype="multipart/form-data">

                {% csrf_token %}

                {{ form.as_p }}

                <button type="submit"
                        class="btn btn-warning w-100">

                    {% if form.instance.pk %}
                        Update Tweet
                    {% else %}
                        Post Tweet
                    {% endif %}

                </button>

            </form>

            <div class="text-center mt-4">

                <a href="{% url 'index' %}" class="home-link">
                    ← Go to Homepage
                </a>

            </div>

        </div>

    </div>

</div>

{% endblock %}
